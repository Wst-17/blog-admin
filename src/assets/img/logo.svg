<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 圆角背景（墨绿色） -->
  <rect width="100" height="100" rx="24" fill="#316C72" />
  
  <!-- 顶部装饰线 -->
  <rect x="20" y="20" width="60" height="6" rx="3" fill="#ffffff" opacity="0.3" />

  <!-- 字母 L、Y、C 的几何排列 -->
  <g fill="#ffffff">
    <!-- L -->
    <path d="M18 32 v30 h12 v-6 h-6 v-24 z" />
    <!-- Y -->
    <path d="M34 32 l8 14 l8 -14 h7 l-11.5 19.5 v11 h-7 v-11 l-11.5 -19.5 z" />
    <!-- C -->
    <path d="M72 32 c-10 0 -16 7 -16 18 c0 11 6 18 16 18 c6 0 10 -2 13 -6 l-5 -5 c-2 2 -4 4 -8 4 c-5 0 -9 -4 -9 -11 c0 -7 4 -11 9 -11 c4 0 6 2 8 4 l5 -5 c-3 -4 -7 -6 -13 -6 z" />
  </g>
  
  <!-- 底部小圆点装饰 -->
  <circle cx="50" cy="82" r="3" fill="#ffffff" opacity="0.6" />
</svg>